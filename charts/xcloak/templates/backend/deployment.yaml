apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xcloak.backend.fullname" . }}
  labels:
    {{- include "xcloak.backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "xcloak.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xcloak.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccount.name | default (include "xcloak.backend.fullname" .) }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "xcloak.postgresql.host" . }} 5432; do echo waiting for postgresql; sleep 2; done
        - name: grant-createrole
          # migrations/000050_rls_tenant_isolation.up.sql (a) self-provisions
          # a dedicated least-privilege xcloak_app role via CREATE ROLE, and
          # (b) backfills tenant_id on pre-existing rows with a bulk UPDATE
          # under the very RLS policies it just created. Both run using the
          # backend's own connection role (DB_USER, "xcloak" by default) —
          # (a) needs CREATEROLE, (b) needs to bypass RLS entirely, since an
          # UPDATE with no session app.tenant_id set matches zero rows under
          # policy and Postgres rejects it outright. The plain `postgres`
          # Docker image's POSTGRES_USER is always a superuser (bypasses RLS
          # implicitly, hence docker-compose deployments never hit this),
          # but the bundled Bitnami postgresql chart's auth.username role
          # gets neither privilege by default. Granting exactly these two
          # (not full superuser) matches docker-compose's existing behavior
          # without going further. Runs every pod start — both ALTER ROLE
          # forms are idempotent, so re-running is a no-op once granted.
          # (A post-install/post-upgrade hook Job was tried first instead of
          # an initContainer here — Helm runs those AFTER the main install's
          # resources are already created, so it raced the backend pod's own
          # first connection attempt instead of reliably preceding it.)
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: {{ include "xcloak.fullname" . }}-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xcloak.fullname" . }}-postgresql
                  key: postgres-password
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -q; do echo waiting for postgresql to accept connections; sleep 2; done
              psql -v ON_ERROR_STOP=1 -c "ALTER ROLE {{ .Values.postgresql.auth.username }} CREATEROLE BYPASSRLS;"
      {{- end }}
      containers:
        - name: backend
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.tls.enabled | ternary 8443 8080 }}
          envFrom:
            - configMapRef:
                name: {{ include "xcloak.backend.fullname" . }}
          env:
            {{- $secretName := .Values.backend.secrets.existingSecret | default (include "xcloak.backend.fullname" .) }}
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: JWT_SECRET } }
            - name: METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: METRICS_TOKEN } }
            {{- if or .Values.backend.secrets.anthropicApiKey .Values.backend.secrets.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: ANTHROPIC_API_KEY, optional: true } }
            {{- end }}
            {{- if or .Values.backend.secrets.smtpPass .Values.backend.secrets.existingSecret }}
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: SMTP_PASS, optional: true } }
            {{- end }}

            {{- if .Values.postgresql.enabled }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-postgresql, key: password } }
            {{- else if .Values.postgresqlExternal.existingSecret }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgresqlExternal.existingSecret }}, key: password } }
            {{- else }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: DB_PASSWORD } }
            {{- end }}

            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-redis, key: redis-password } }
            {{- else if .Values.redisExternal.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.redisExternal.existingSecret }}, key: password } }
            {{- end }}

            {{- if and .Values.minioExternal.enabled .Values.minioExternal.existingSecret }}
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.minioExternal.existingSecret }}, key: accessKey } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.minioExternal.existingSecret }}, key: secretKey } }
            {{- end }}

            {{- if .Values.vault.enabled }}
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.vault.existingSecret }}, key: {{ .Values.vault.tokenSecretKey }} } }
            {{- end }}
          {{- if .Values.backend.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/xcloak/tls
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.backend.tls.existingSecret }}
      {{- end }}
