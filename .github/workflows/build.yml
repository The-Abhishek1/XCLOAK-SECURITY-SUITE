name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xcloak-platform/backend

    # Mirrors backend-ci.yml's services/env — several tests (e.g. the Redis
    # session-blacklist middleware test) need real Postgres/Redis, not mocks.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: xcloak
          POSTGRES_PASSWORD: xcloak_ci_password
          POSTGRES_DB: ngfw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: xcloak
      DB_PASSWORD: xcloak_ci_password
      DB_NAME: ngfw
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-32chars-min
      METRICS_TOKEN: ci-test-metrics-token
      RUN_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xcloak-platform/backend/go.mod
          cache-dependency-path: xcloak-platform/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 120s

  # ── Go Agent — Linux ──────────────────────────────────────────────────────
  agent-linux:
    name: Agent (Linux amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xcloak-agent-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xcloak-agent-desktop/go.mod
          cache-dependency-path: xcloak-agent-desktop/go.sum

      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -o xcloak-agent-linux-amd64 ./main.go

      - name: Vet
        run: go vet ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcloak-agent-linux-amd64
          path: xcloak-agent-desktop/xcloak-agent-linux-amd64

  # ── Go Agent — Windows ────────────────────────────────────────────────────
  agent-windows:
    name: Agent (Windows amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xcloak-agent-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xcloak-agent-desktop/go.mod
          cache-dependency-path: xcloak-agent-desktop/go.sum

      - name: Build (cross-compile)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o xcloak-agent-windows-amd64.exe ./main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcloak-agent-windows-amd64
          path: xcloak-agent-desktop/xcloak-agent-windows-amd64.exe

  # ── Mobile Agent (Flutter / Android) ─────────────────────────────────────
  mobile:
    name: Mobile Agent (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xcloak-agent-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcloak-agent-android
          path: xcloak-agent-mobile/build/app/outputs/flutter-apk/app-release.apk

  # ── Helm chart lint ───────────────────────────────────────────────────────
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Update dependencies
        run: helm dependency update charts/xcloak

      - name: Lint chart
        run: helm lint charts/xcloak --values charts/xcloak/ci/smoke-values.yaml --strict
